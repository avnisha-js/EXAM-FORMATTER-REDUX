<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Format Exam</title>
  <style>
    body { font-family: Calibri, sans-serif; margin: 2rem auto; max-width: 40rem; }
    label { display: inline-block; width: 7rem; }
    div { margin: 0.5rem 0; }
    .error { color: #8b0000; white-space: pre-wrap; }
    a { color: #111; }
  </style>
</head>
<body>
  <p><a href="{{ url_for('home') }}">EXAM FORMATTER</a></p>
  <h1>Format Exam</h1>
  {% if error %}<p class="error"><strong>{{ error }}</strong></p>{% endif %}
  <form method="post" action="{{ url_for('format_exam') }}" enctype="multipart/form-data">
    <div><label for="grade">Grade:</label> <input id="grade" name="grade" required></div>
    <div><label for="subject">Subject:</label> <input id="subject" name="subject" required></div>
    <div><label for="teacher">Teacher Exam Word File:</label> <input id="teacher" type="file" name="teacher" accept=".docx" required></div>
    <button type="submit">Format Exam</button>
  </form>
</body>
</html>
